<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>シャニマスイントロクイズ</title>

    <!-- jQuery と Select2 の読み込み -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        /* 画面全体の背景（温かみのあるオレンジ・ピンク系のグラデーション） */
        /* 画面全体の背景 */
        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; 
            padding: 20px; 
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            /* フレックスボックスをやめて確実な中央揃えに変更しました */
        }

        /* メイン画面の枠組み（すりガラスパネル） */
        /* メイン画面の枠組み（すりガラスパネルを大きく拡大） */
        .screen { 
            display: none; 
            width: 100%;
            min-width: 320px; 
            max-width: 800px; /* ★ 600pxから800pxに拡大しました */
            margin: 5vh auto; 
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 45px; /* ★ パディングを増やしてゆったりさせました */
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            font-size: 18px; /* ★ 全体の基本文字サイズを大きくしました */
        }
        .screen.active { display: block; }
    
        .screen.active {
            display: block;
        }
    
        /* 文字色と影の調整 */
        h1,
        h2,
        h3,
        label,
        p {
            color: #333;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
        }
    
        /* 設定エリアなどの小枠も薄いすりガラスに */
        .settings,
        .audio-controls {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    
        /* ボタンのデザイン（すりガラス＆ホバーで浮き上がる） */
        .btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 8px;
            /* HTML側の直接指定を上書きしてデザインを統一 */
            background: rgba(255, 255, 255, 0.65) !important;
            color: #333 !important;
            border: 1px solid rgba(255, 255, 255, 0.8) !important;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
    
        .btn:hover {
            background: rgba(255, 255, 255, 0.9) !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
    
        /* セレクトボックス（入力欄）のデザイン */
        select:not(.select2-hidden-accessible) {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.8);
        }
    
        .audio-controls button {
            margin: 0 5px;
            width: 80%;
        }
    
        .dropdown-group {
            margin-bottom: 15px;
        }
    
        /* Select2（検索プルダウン）のジャンル見出し折りたたみ用 */
        .select2-results__group {
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.6);
            padding: 8px !important;
            border-radius: 4px;
            margin: 2px 0;
            transition: background-color 0.2s;
        }
    
        .select2-results__group:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }
    
        .select2-results__group::after {
            content: ' ▼';
            font-size: 12px;
            float: right;
            color: #666;
        }
    </style>
</head>

<body>

    <!-- 1. スタート画面 -->
    <div id="start-screen" class="screen active">
        <h1>シャニマスイントロクイズ</h1>
        <div class="settings">
            <label>問題数:
                <select id="question-count">
                    <option value="5">5問</option>
                    <option value="10">10問</option>
                    <option value="15">15問</option>
                    <option value="20">20問</option>
                    <option value="25">25問</option>
                    <option value="30">30問</option>
                </select>
            </label>
            <br><br>
            <label>出題範囲 (ジャンル):
                <select id="start-genre-filter">
                    <option value="all">すべて (全曲から出題)</option>
                </select>
            </label>
        </div>
        <button class="btn" onclick="startGame()"
            style="background-color: #28a745; color: white; border: none; width: 100%;">ゲーム開始</button>
    </div>

    <!-- 2. クイズ画面 -->
    <div id="quiz-screen" class="screen">
        <h2 id="quiz-status">第 1 問</h2>

        <div class="settings">
            <label>難易度 (再生時間):
                <select id="quiz-level" onchange="resetTimer()">
                    <option value="3000">レベル1 (3秒)</option>
                    <option value="1500">レベル2 (1.5秒)</option>
                    <option value="500">レベル3 (0.5秒)</option>
                </select>
            </label>
        </div>
<button id="quiz-play-btn" class="btn" onclick="toggleQuizAudio()" style="display: block; margin: 0 auto;">▶
    曲を再生する</button>
        

        <div style="margin-top: 20px;">
            <label>解答を選択してください:</label><br>
            <!-- 1つのプルダウン枠に戻しました -->
            <select id="answer-select">
                <option value="">-- 曲名を検索・選択 --</option>
            </select>
        </div>
        <button class="btn" onclick="submitAnswer()"
            style="margin-top: 20px; background-color: #007bff; color: white; width: 100%; border: none;">解答する</button>
            <button class="btn" onclick="passQuestion()"
                style="width: 100%; background-color: #6c757d; color: white; border: none; margin-top: 10px;">パスする</button>
    </div>

    <!-- 3. 解答・解説画面 -->
    <div id="answer-screen" class="screen">
        <h1 id="judge-text"></h1>
        <h2 id="correct-song-title" style="color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 5px;"></h2>

        <img id="jacket-image" src="" alt="ジャケット画像"
            style="max-width: 250px; display: none; margin: 15px auto; border-radius: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

        <div class="audio-controls">
            <button id="toggle-audio-btn" class="btn" onclick="toggleAudio()" style="display: block; margin: 0 auto;">▶
                再生</button>
        </div>

        <button id="next-btn" class="btn" onclick="nextQuestion()"
            style="margin-top: 20px; background-color: #28a745; color: white; width: 100%; border: none;">次の問題へ</button>
    </div>

    <!-- 4. 結果画面 -->
    
    <div id="result-screen" class="screen">
        <!-- 横並びにするための枠 -->
        <div
            style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px;">
    
            <!-- 左側：総合評価とスコア -->
            <div style="width: 45%; text-align: center;">
                <!-- 総合評価の画像（ご自身で作成されたら画像をimagesフォルダに入れ、ここのsrcのファイル名を合わせてください） -->
                <img src="images/総合評価.png" alt="総合評価" style="width: 100%; max-width: 200px; margin-bottom: 10px;">
    
                <!-- 正答数表示（分子大きく、分母小さく） -->
                <div style="margin-top: 10px; line-height: 1;">
                    <span id="score-numerator"
                        style="font-size: 64px; font-weight: bold; color: #ff3b30; text-shadow: 2px 2px 0px #fff;">0</span>
                    <span style="font-size: 32px; font-weight: bold; color: #555; margin: 0 5px;">/</span>
                    <span id="score-denominator" style="font-size: 32px; font-weight: bold; color: #555;">0</span>
                </div>
                <h3 id="rank-text" style="color: #ff3b30; margin-top: 10px; font-size: 18px;"></h3>
            </div>
    
            <!-- 右側：アイドル画像 -->
            <div style="width: 50%; text-align: center;">
                <!-- アイドル画像（大きめに設定） -->
                <img id="result-idol-image" src="" alt="アイドル"
                    style="width: 100%; max-width: 400px; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.2);">
            </div>
        </div>
    
        <!-- 間違えた曲リスト -->
        <div id="review-area"
            style="display: none; background: rgba(255,255,255,0.5); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h4 style="margin-top: 0; color: #333;">間違えた曲リスト (復習)</h4>
            <ul id="wrong-songs-list" style="text-align: left; margin: 0; padding-left: 20px; color: #555;"></ul>
        </div>
    
        <button class="btn" onclick="resetGame()"
            style="width: 100%; background-color: #007bff; color: white; border: none;">トップに戻る</button>
    </div>

            const groupedSongs = {};

            songDatabase.forEach(song => {

                if (!groupedSongs[song.genre]) {

            });

            // 1つのプルダウン内に、ジャンルごとの optgroup を自動生成して追加
            const answerSelect = $('#answer-select');

        // ==========================================

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
                const count = parseInt(document.getElementById('question-count').value);
                const selectedGenre = document.getElementById('start-genre-filter').value;

                // 1. 出題する曲の絞り込み
                let filteredDB = songDatabase;
                if (selectedGenre !== 'all') {
                    filteredDB = songDatabase.filter(song => song.genre === selectedGenre);
                }

                let shuffled = [...filteredDB].sort(() => 0.5 - Math.random());
                const maxQuestions = Math.min(count, shuffled.length);

                if (maxQuestions === 0) {
                    alert("選択したジャンルに曲が登録されていません。");
                    return;
                }

                // ▼▼ 今回の追加箇所：解答プルダウンの中身を出題範囲に合わせる ▼▼
                const answerSelect = $('#answer-select');
                answerSelect.empty(); // 今の選択肢を一旦全部消す
                answerSelect.append('<option value="">-- 曲名を検索・選択 --</option>');

                // 絞り込まれた曲のデータ（filteredDB）だけでリストを作り直す
                const groupedSongs = {};
                filteredDB.forEach(song => {
                    if (!groupedSongs[song.genre]) {
                        groupedSongs[song.genre] = [];
                    }
                    groupedSongs[song.genre].push(song.title);
                });

                for (const genre in groupedSongs) {
                    const optgroup = $('<optgroup>').attr('label', genre);
                    groupedSongs[genre].forEach(title => {
                        optgroup.append($('<option>').val(title).text(title));
                    });
                    answerSelect.append(optgroup);
                }

                // Select2の見た目を更新
                answerSelect.select2({
                    placeholder: "-- 曲名を検索・選択 --",
                    allowClear: true,
                    width: '100%'
                });
                // ▲▲ ここまで ▲▲

                currentQuestions = shuffled.slice(0, maxQuestions);
                currentQuestionIndex = 0;
                score = 0;

                showScreen('quiz-screen');
                updateQuizUI();
            }

        function updateQuizUI() {
            document.getElementById('quiz-status').innerText = `第 ${currentQuestionIndex + 1} 問 / 全 ${currentQuestions.length} 問`;

            // 解答欄のリセット (Select2の見た目もリセット)
            $('#answer-select').val(null).trigger('change');

            resetTimer();

            audioPlayer.src = currentQuestions[currentQuestionIndex].src;
            audioPlayer.load();
        }

        function resetTimer() {
            remainingTime = parseInt(document.getElementById('quiz-level').value);
            document.getElementById('quiz-play-btn').innerText = "▶ 曲を再生する";
        }

        function toggleQuizAudio() {
            const btn = document.getElementById('quiz-play-btn');

            if (audioPlayer.paused) {
                if (remainingTime <= 0) return;

                audioPlayer.play().then(() => {
                    btn.innerText = "⏸ 停止";
                    lastPlayTime = Date.now();

                    stopTimer = setTimeout(() => {
                        audioPlayer.pause();
                        btn.innerText = "時間切れ (解答してください)";
                        remainingTime = 0;
                    }, remainingTime);
                }).catch(e => {
                    alert("音声ファイルが見つからないか、自動再生がブロックされています。");
                });
            } else {
                audioPlayer.pause();
                clearTimeout(stopTimer);
                btn.innerText = "▶ 続きから再生";
                remainingTime -= (Date.now() - lastPlayTime);
            }
        }

        function submitAnswer() {
            const selected = $('#answer-select').val();
            const currentSong = currentQuestions[currentQuestionIndex];
            const correctTitle = currentSong.title;

            if (!selected) {
                alert("曲を選択してください！");
                return;
            }

            audioPlayer.pause();
            if (stopTimer) clearTimeout(stopTimer);
            audioPlayer.currentTime = 0;

            const judgeText = document.getElementById('judge-text');

            if (selected === correctTitle) {
                judgeText.innerText = "⭕ 正解！";
                judgeText.style.color = "green";
                correctSE.currentTime = 0;
                correctSE.play();
                score++;
            } else {
                judgeText.innerText = "❌ 不正解...";
                judgeText.style.color = "red";
                incorrectSE.currentTime = 0;
                incorrectSE.play();
            }

            document.getElementById('correct-song-title').innerText = `「${correctTitle}」`;

            const jacketImg = document.getElementById('jacket-image');
            if (currentSong.image) {
                jacketImg.src = currentSong.image;

            }

                    if (reviewArea) reviewArea.style.display = 'block';
                } else {
                    if (reviewArea) reviewArea.style.display = 'none';
                }

                // 3. アイドル画像の設定（ジャンル指定に関わらず、全画像から集めてランダム選択）
                const selectedGenre = document.getElementById('start-genre-filter').value;
                let targetImages = [];

                // 1. まず、選ばれたジャンルの画像があればそれを候補に入れる
                if (genreResultData[selectedGenre] && genreResultData[selectedGenre].images) {
                    targetImages = targetImages.concat(genreResultData[selectedGenre].images);
                }

                // 2. もしジャンル画像が見つからない場合（「すべて」を選んだ場合など）、全ジャンルの画像を全て集める
                if (targetImages.length === 0) {
                    for (const key in genreResultData) {
                        // default や他の項目も含めて、images配列を持っているものから全てかき集める
                        if (genreResultData[key] && genreResultData[key].images) {
                            targetImages = targetImages.concat(genreResultData[key].images);
                        }
                    }
                }

                // 3. 集めた候補の中からランダムに1枚選んで表示する
                if (targetImages.length > 0) {
                    const randomIndex = Math.floor(Math.random() * targetImages.length);
                    document.getElementById('result-idol-image').src = targetImages[randomIndex];
                } else {
                    document.getElementById('result-idol-image').src = "";
                }

                // 4. ランク判定
                const accuracy = score / currentQuestions.length;
                const rankText = document.getElementById('rank-text');

                if (accuracy === 1) {
                    rankText.innerText = "👑 パーフェクト！！";
                } else if (accuracy >= 0.8) {
                    rankText.innerText = "✨ あと一歩！";
                } else if (accuracy >= 0.5) {
                    rankText.innerText = "👍 ナイスファイト！";
                } else {
                    rankText.innerText = "💪 次こそリベンジ！";
                }

                showScreen('result-screen');
            }
        }

        function resetGame() {
            audioPlayer.pause();
            showScreen('start-screen');
        }

        // ▼▼ ここから追加 ▼▼
            // 1. ジャンル見出しをクリックしたら、その中の曲リストを開閉する
            $(document).on('click', '.select2-results__group', function () {
                $(this).siblings('ul').slideToggle(200);
            });

            // 2. プルダウンを開いた直後は、ジャンルを閉じた状態（見出しだけ）にしておく
            $('#answer-select').on('select2:open', function () {
                // Select2が画面を作るのを一瞬待つ必要があるため setTimeout を使用
                setTimeout(function () {
                    // 文字を検索していない初期状態の時だけ閉じる
                    if ($('.select2-search__field').val() === '') {
                        $('.select2-results__group').siblings('ul').hide();
                    }
                }, 10);
            });


            // === ここから追加：画像の先回り読み込み（プリロード） ===
                window.addEventListener('load', function () {
                    // 最初のスタート画面が表示されてから1秒後に、全画像を裏側でこっそりダウンロード開始
                    setTimeout(function () {
                        songDatabase.forEach(function (song) {
                            if (song.image) {
                                const preImg = new Image();
                                preImg.src = song.image;
                            }
                        });
                    }, 1000);
                });
