<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シャニマスイントロクイズ</title>

    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap"
        rel="stylesheet">
    <!-- jQuery と Select2 の読み込み -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        /* 画面全体の背景 */
        body {
            font-family: 'M PLUS Rounded 1c', 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #cce0ff 0%, #8dbbff 100%);
            /* フレックスボックスをやめて確実な中央揃えに変更しました */
        }

        /* メイン画面の枠組み（すりガラスパネル） */
        /* メイン画面の枠組み（すりガラスパネルを大きく拡大） */
        .screen {
            display: none;
            width: 100%;
            min-width: 320px;
            max-width: 800px;
            /* ★ 600pxから800pxに拡大しました */
            margin: 5vh auto;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 45px;
            /* ★ パディングを増やしてゆったりさせました */
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            font-size: 18px;
            /* ★ 全体の基本文字サイズを大きくしました */
        }


        .screen.active {
            display: block;
        }

        /* 文字色と影の調整 */
        #start-screen h1 {
            color: #ffffff;
            text-align: center;
            text-shadow:
                2px 2px 0 #8dbbff,
                -2px -2px 0 #8dbbff,
                2px -2px 0 #8dbbff,
                -2px 2px 0 #8dbbff,
                0px 5px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        h2,
        h3,
        label,
        p {
            color: #333;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        /* 設定エリアなどの小枠も薄いすりガラスに */
        .settings,
        .audio-controls {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* ボタンのデザイン（すりガラス＆ホバーで浮き上がる） */
        .btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 8px;
            /* HTML側の直接指定を上書きしてデザインを統一 */
            background: rgba(255, 255, 255, 0.65) !important;
            color: #333 !important;
            border: 1px solid rgba(255, 255, 255, 0.8) !important;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.9) !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        /* ▼▼ 追加：難易度ボタンが選択されている時のデザイン ▼▼ */
        .level-btn.active {
            background: #ff7e67 !important;
            /* 目立つコーラルオレンジ */
            color: #ffffff !important;
            border: 1px solid #ff7e67 !important;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.2) !important;
            text-shadow: none !important;
        }

        /* セレクトボックス（入力欄）のデザイン */
        select:not(.select2-hidden-accessible) {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.8);
        }

        .audio-controls button {
            margin: 0 5px;
            width: 80%;
        }



        /* Select2（検索プルダウン）のジャンル見出し折りたたみ用 */
        .select2-results__group {
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.6);
            padding: 8px !important;
            border-radius: 4px;
            margin: 2px 0;
            transition: background-color 0.2s;
        }

        .select2-results__group:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }

        .select2-results__group::after {
            content: ' ▼';
            font-size: 12px;
            float: right;
            color: #666;
        }

        /* ▼▼ 追加：複数選択（カスタムモード等）の文字見切れ修正 ▼▼ */
        .select2-container .select2-search--inline .select2-search__field {
            height: auto !important;
            line-height: 0.8 !important;
            padding-top: 0px !important;
        }

        .select2-container--default .select2-selection--multiple {
            min-height: 30px !important;
            padding: 2px 6px !important;
            border-radius: 8px !important;
            border: 1px solid rgba(255, 255, 255, 0.8) !important;
            background: rgba(255, 255, 255, 0.8) !important;
        }

        /* スマホ画面用の調整（画面幅が600px以下の時だけ適用） */
        @media (max-width: 600px) {
            .screen {
                padding: 20px;
                /* スマホでは余白を狭くして中身を広く使う */
                margin: 2vh auto;
            }

            #score-numerator {
                font-size: 48px !important;
                /* スマホでは点数の文字を少しだけ小さく */
            }

            /* ▼▼ 追加：タイトルの文字をスマホに合わせて少し小さくする ▼▼ */
            #start-screen h1 {
                font-size: 28px;
                text-shadow:
                    1.5px 1.5px 0 #8dbbff,
                    -1.5px -1.5px 0 #8dbbff,
                    1.5px -1.5px 0 #8dbbff,
                    -1.5px 1.5px 0 #8dbbff,
                    0px 3px 5px rgba(0, 0, 0, 0.3);
            }

        }
    </style>
</head>

<body>

    <!-- 1. スタート画面 -->
    <div id="start-screen" class="screen active">
        <h1>シャニマスイントロクイズ</h1>
        <div class="settings">
            <label>問題数:
                <select id="question-count">
                    <option value="5">5問</option>
                    <option value="10">10問</option>
                    <option value="15">15問</option>
                    <option value="20">20問</option>
                    <option value="25">25問</option>
                    <option value="30">30問</option>
                </select>
            </label>
            <br><br>
            <label>出題範囲 (ジャンル):
                <select id="start-genre-filter">
                    <option value="all">すべて (全曲から出題)</option>
                </select>
            </label>
        </div>
        <button class="btn" onclick="startGame()"
            style="background-color: #28a745; color: white; border: none; width: 100%;">ゲーム開始</button>

        <!-- ▼▼ ここからカスタムモード用のUIを追加 ▼▼ -->
        <hr style="border: 1px solid rgba(255,255,255,0.5); margin: 30px 0 20px 0;">
        <h3 style="text-align: center;">🎨 カスタムモード</h3>
        <div class="settings">
            <label>好きな曲を選んで遊ぶ (複数可):</label><br>
            <select id="custom-song-select" multiple="multiple">
                <!-- JavaScriptで全曲追加されます -->
            </select>
        </div>
        <button class="btn" onclick="startCustomGame()"
            style="background-color: #ff9800; color: white; border: none; width: 100%;">選択した曲でゲーム開始</button>

    </div>

    <!-- 2. クイズ画面 -->
    <div id="quiz-screen" class="screen">
        <h2 id="quiz-status">第 1 問</h2>

        <div class="settings">
            <label style="display: block; text-align: center; margin-bottom: 10px; font-weight: bold;">難易度</label>
            <div style="display: flex; justify-content: space-between; gap: 10px;">
                <!-- ▼ レベル3の data-value の数字(1000)は現在の設定に合わせてください ▼ -->
                <button class="btn level-btn active" data-value="1000" onclick="selectLevel(this)"
                    style="flex: 1; padding: 10px 2px; font-size: 15px; margin: 0;">レベル3</button>
                <button class="btn level-btn" data-value="mid_intro" onclick="selectLevel(this)"
                    style="flex: 1; padding: 10px 2px; font-size: 15px; margin: 0;">レベル2</button>
                <button class="btn level-btn" data-value="intro" onclick="selectLevel(this)"
                    style="flex: 1; padding: 10px 2px; font-size: 15px; margin: 0;">レベル1</button>
            </div>
            <!-- 裏でタイマー計算に使うための隠し項目（初期値はレベル3の値） -->
            <input type="hidden" id="quiz-level" value="1000">
        </div>
        <button id="quiz-play-btn" class="btn" onclick="toggleQuizAudio()" style="display: block; margin: 0 auto;">▶
            曲を再生する</button>


        <div style="margin-top: 20px;">
            <label>解答を選択してください:</label><br>
            <!-- 1つのプルダウン枠に戻しました -->
            <select id="answer-select">
                <option value="">-- 曲名を検索・選択 --</option>
            </select>
        </div>
        <button class="btn" onclick="submitAnswer()"
            style="margin-top: 20px; background-color: #007bff; color: white; width: 100%; border: none;">解答する</button>
        <button class="btn" onclick="passQuestion()"
            style="width: 100%; background-color: #6c757d; color: white; border: none; margin-top: 10px;">パスする</button>
    </div>

    <!-- 3. 解答・解説画面 -->
    <div id="answer-screen" class="screen">
        <h1 id="judge-text"></h1>
        <h2 id="correct-song-title" style="color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 5px;"></h2>

        <img id="jacket-image" src="" alt="ジャケット画像"
            style="max-width: 250px; display: none; margin: 15px auto; border-radius: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

        <div class="audio-controls">
            <button id="toggle-audio-btn" class="btn" onclick="toggleAudio()" style="display: block; margin: 0 auto;">▶
                再生</button>
        </div>

        <button id="next-btn" class="btn" onclick="nextQuestion()"
            style="margin-top: 20px; background-color: #28a745; color: white; width: 100%; border: none;">次の問題へ</button>
    </div>

    <!-- 4. 結果画面 -->

    <div id="result-screen" class="screen">
        <!-- 横並びにするための枠 -->
        <div
            style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px;">

            <!-- 左側：総合評価とスコア -->
            <div style="width: 45%; text-align: center;">
                <!-- 総合評価の画像（ご自身で作成されたら画像をimagesフォルダに入れ、ここのsrcのファイル名を合わせてください） -->
                <img src="images/総合評価.png" alt="総合評価" style="width: 100%; max-width: 200px; margin-bottom: 10px;">

                <!-- 正答数表示（分子大きく、分母小さく） -->
                <div style="margin-top: 10px; line-height: 1;">
                    <span id="score-numerator"
                        style="font-size: 64px; font-weight: bold; color: #ff3b30; text-shadow: 2px 2px 0px #fff;">0</span>
                    <span style="font-size: 32px; font-weight: bold; color: #555; margin: 0 5px;">/</span>
                    <span id="score-denominator" style="font-size: 32px; font-weight: bold; color: #555;">0</span>
                </div>
            </div>

            <!-- 右側：アイドル画像 -->
            <div style="width: 50%; text-align: center;">
                <!-- アイドル画像（大きめに設定） -->
                <img id="result-idol-image" src="" alt="アイドル"
                    style="width: 100%; max-width: 400px; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.2);">
            </div>
        </div>

        <!-- 間違えた曲リスト -->
        <div id="review-area"
            style="display: none; background: rgba(255,255,255,0.5); padding: 15px; border-radius: 8px; margin-bottom: 20px; max-height: 300px; overflow-y: auto;">
            <h4 style="margin-top: 0; color: #333;">リザルト</h4>
            <ul id="wrong-songs-list" style="text-align: left; margin: 0; padding-left: 20px; color: #555;"></ul>
        </div>

        <button class="btn" onclick="resetGame()"
            style="width: 100%; background-color: #007bff; color: white; border: none;">トップに戻る</button>
    </div>

        function normalizeText(str) {
            if (!str) return "";
            // 大文字を小文字に変換
            let normalized = str.toLowerCase();
            // カタカナをひらがなに変換
            normalized = normalized.replace(/[\u30A1-\u30F6]/g, function (match) {
                return String.fromCharCode(match.charCodeAt(0) - 0x60);
            });
            return normalized;
        }

        function customSearchMatcher(params, data) {
            if ($.trim(params.term) === '') {
                return data;
            }
            // ジャンル名（optgroup）の中身も検索できるようにする処理
            if (data.children) {
                const matchedChildren = [];
                $.each(data.children, function (index, child) {
                    const searchTerm = normalizeText(params.term);
                    const itemText = normalizeText(child.text);
                    if (itemText.indexOf(searchTerm) > -1) {
                        matchedChildren.push(child);
                    }
                });
                if (matchedChildren.length > 0) {
                    const modifiedData = $.extend({}, data, true);
                    modifiedData.children = matchedChildren;
                    return modifiedData;
                }
                return null;
            }
            // 選択肢（曲名）の判定
            const searchTerm = normalizeText(params.term);
            const itemText = normalizeText(data.text);
            if (itemText.indexOf(searchTerm) > -1) {
                return data;
            }
            return null;
        }

        function resetTimer() {
            const levelValue = document.getElementById('quiz-level').value;
            const currentSong = currentQuestions[currentQuestionIndex];

            // 曲の開始位置（設定がなければ0秒）
            const startTime = currentSong && currentSong.start ? currentSong.start : 0;

            if (levelValue === "intro") {
                const endTime = currentSong && currentSong.introEnd ? currentSong.introEnd : (startTime + 3);
                remainingTime = (endTime - startTime) * 1000;
            } else if (levelValue === "mid_intro") {
                const endTime = currentSong && currentSong.introMid ? currentSong.introMid : (startTime + 2.0);
                remainingTime = (endTime - startTime) * 1000;
            } else {
                // ▼▼ 変更：レベル3用の個別設定（introShort）があればそれを優先 ▼▼
                if (currentSong && currentSong.introShort) {
                    // introShort（レベル3の終了秒数）が設定されている場合の計算
                    remainingTime = (currentSong.introShort - startTime) * 1000;
                } else {
                    // 設定がない場合はプルダウンの固定秒数（例：1000ミリ秒）
                    remainingTime = parseInt(levelValue);

                    // 特定の曲だけ制限時間を削る処理（引き続き使えます）
                    if (currentSong && currentSong.shorten) {
                        remainingTime -= currentSong.shorten;
                    }
                }
            }

            document.getElementById('quiz-play-btn').innerText = "▶ 曲を再生する";

            audioPlayer.pause();

            if (currentQuestions.length > 0) {
                try {
                    audioPlayer.currentTime = startTime;
                } catch (e) { }
            }

            if (typeof stopTimer !== 'undefined' && stopTimer) {
                clearTimeout(stopTimer);
            }
        }

        function toggleQuizAudio() {
            const btn = document.getElementById('quiz-play-btn');
            const currentLevel = document.getElementById('quiz-level').value;

            if (audioPlayer.paused) {
                if (remainingTime <= 0) return;

                // ▼▼ 追加：新しく再生を開始する時の回数チェックと減点 ▼▼
                if (btn.innerText === "▶ 曲を再生する") {
                    if (levelPlayCounts[currentLevel] <= 0) {
                        alert("このレベルの再生回数（2回）を使い切りました。他のレベルかパスを選んでください。");
                        return;
                    }

                    // 回数を1減らして画面を更新
                    levelPlayCounts[currentLevel]--;
                    updateLevelButtonText();

                    // 一番甘いヒント（低いレベル）に合わせて獲得ポイントを下げる
                    if (currentLevel === "mid_intro") {
                        currentQuestionPotentialScore = Math.min(currentQuestionPotentialScore, 2);
                    } else if (currentLevel === "intro") {
                        currentQuestionPotentialScore = Math.min(currentQuestionPotentialScore, 1);
                    }
                }
                // ▲▲ ここまで ▲▲

                btn.innerText = "⏳ 準備中...";
                btn.disabled = true;

                setTimeout(() => {
                    audioPlayer.play().then(() => {
                        btn.innerText = "⏸ 停止";
                        btn.disabled = false;
                        lastPlayTime = Date.now();

                        stopTimer = setTimeout(() => {
                            audioPlayer.pause();
                            btn.innerText = "時間切れ (解答してください)";
                            remainingTime = 0;

                            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));

                    

                        }, remainingTime);
                    }).catch(e => {
                        btn.disabled = false;
                        alert("音声ファイルが見つからないか、自動再生がブロックされています。");
                    });
                }, 200);

            } else {
                audioPlayer.pause();
                clearTimeout(stopTimer);
                btn.innerText = "▶ 続きから再生";
                remainingTime -= (Date.now() - lastPlayTime);
            }
        }

            // ▼ jacket ではなく image を見るように修正しました ▼
            const jacketImg = document.getElementById('jacket-image');
            if (currentSong.image) {
                jacketImg.src = currentSong.image;
                jacketImg.style.display = "block";
            } else {
                jacketImg.style.display = "none";
            }

            // 音声を停止して解説画面へ
            audioPlayer.pause();

            // ★追加：生き残っている時限爆弾（タイマー）を確実に解除する
            if (typeof stopTimer !== 'undefined' && stopTimer) {
                clearTimeout(stopTimer);
            }


            // ▼▼ 変更：0秒ではなく曲ごとの開始位置に巻き戻す ▼▼
            const startTime = currentSong.start || 0;
            audioPlayer.currentTime = startTime;

            // ▼▼ 追加：最後の問題かどうかでボタンの文字を切り替える ▼▼
            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtn.innerText = "結果発表へ";
            } else {
                nextBtn.innerText = "次の問題へ";
            }


            showScreen('answer-screen');
        }




        function submitAnswer() {
            const selected = $('#answer-select').val();
            const currentSong = currentQuestions[currentQuestionIndex];
            const correctTitle = currentSong.title;

            if (!selected) {
                alert("曲を選択してください！");
                return;
            }

            audioPlayer.pause();
            if (stopTimer) clearTimeout(stopTimer);
            // ▼▼ 変更：0秒ではなく曲ごとの開始位置に巻き戻す ▼▼
            const startTime = currentSong.start || 0;
            audioPlayer.currentTime = startTime;

            const judgeText = document.getElementById('judge-text');
            if (judgeText.style.textShadow) {
                judgeText.style.textShadow = ""; // パス時の縁取りリセット
            }

            // ▼▼ 特殊な正解判定の追加 ▼▼
            let isCorrect = false;
            if (selected === correctTitle) {
                isCorrect = true; // 通常の正解
            } else if (
                (correctTitle === "感謝のコントレイル" && selected === "キズナシェアリング") ||
                (correctTitle === "キズナシェアリング" && selected === "感謝のコントレイル")
            ) {
                isCorrect = true; // どちらを選んでも正解とする例外処理
            }
            // ▲▲ ここまで ▲▲

            // 判定結果による処理の分岐
            if (isCorrect) {
                // ▼▼ 変更：獲得ポイントを表示し、その分だけ加算する ▼▼
                judgeText.innerText = `⭕ 正解！ (+${currentQuestionPotentialScore}点)`;
                judgeText.style.color = "green";
                correctSE.currentTime = 0;
                correctSE.play();
                score += currentQuestionPotentialScore;

                // ▼▼ 追加：正解の履歴を保存 ▼▼
                questionHistory.push({ title: correctTitle, result: `⭕ レベル${currentQuestionPotentialScore}で正解 (+${currentQuestionPotentialScore}点)` });


            } else {
                judgeText.innerText = "❌ 不正解...";
                judgeText.style.color = "red";
                incorrectSE.currentTime = 0;
                incorrectSE.play();

                // ▼▼ 追加：不正解の履歴を保存 ▼▼
                questionHistory.push({ title: correctTitle, result: "❌ 不正解" });
            }


            // 解説画面の曲名表示（データベース上の正解曲名を表示）
            document.getElementById('correct-song-title').innerText = `「${correctTitle}」`;

            const jacketImg = document.getElementById('jacket-image');
            if (currentSong.image) {
                jacketImg.src = currentSong.image;
                jacketImg.style.display = "block";
            } else {
                jacketImg.style.display = "none";
            }

            document.getElementById('toggle-audio-btn').innerText = "▶ 再生";

            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtn.innerText = "結果発表へ";
            } else {
                nextBtn.innerText = "次の問題へ";
            }

            showScreen('answer-screen');
        }



        function toggleAudio() {
            const btn = document.getElementById('toggle-audio-btn');
            if (audioPlayer.paused) {
                audioPlayer.play();
                btn.innerText = "⏸ 停止";
            } else {
                audioPlayer.pause();
                btn.innerText = "▶ 再生 ";
            }
        }

        audioPlayer.onended = function () {
            if (document.getElementById('answer-screen').classList.contains('active')) {
                document.getElementById('toggle-audio-btn').innerText = "▶ 再生";
            }
        };

        function nextQuestion() {
            audioPlayer.pause();
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                updateQuizUI();
                showScreen('quiz-screen');
            } else {
                // ▼▼ 結果画面の表示処理 ▼▼

                // 1. スコアの分子と分母をセット
                document.getElementById('score-numerator').innerText = score;
                // ★ 修正：分母を問題数ではなく「満点 (maxTotalScore)」に設定
                document.getElementById('score-denominator').innerText = maxTotalScore;

                // 2. 出題履歴リストの処理
                const reviewArea = document.getElementById('review-area');
                const wrongList = document.getElementById('wrong-songs-list');

                if (wrongList) {
                    wrongList.innerHTML = '';
                    // 記録した履歴を1問ずつリストに追加
                    questionHistory.forEach((item, index) => {
                        const li = document.createElement('li');
                        li.style.marginBottom = "8px"; // 行間を少し空ける
                        li.style.lineHeight = "1.4";

                        // 結果に応じて文字の色を変える
                        let resultColor = "#555";
                        if (item.result.includes("⭕")) resultColor = "green";
                        if (item.result.includes("❌")) resultColor = "red";

                        li.innerHTML = `<strong>Q${index + 1}.</strong> <span style="color: ${resultColor}; font-weight: bold;">${item.result}</span><br><span style="font-size: 14px;">${item.title}</span>`;
                        wrongList.appendChild(li);
                    });
                }

                // 履歴エリアを表示
                if (reviewArea) reviewArea.style.display = 'block';

                // 3. アイドル画像の設定
                document.getElementById('result-idol-image').src = resultIdolImageSrc;

                // ※ ランクテキスト（rankText）の処理は削除しました

                showScreen('result-screen');
            }
        }

        function resetGame() {
            audioPlayer.pause();
            showScreen('start-screen');
            // ▼▼ 追加：トップに戻る時に背景色をデフォルトに戻す ▼▼
            document.body.style.background = "";


        }

        // ▼▼ ここから追加 ▼▼
        // 1. ジャンル見出しをクリックしたら、その中の曲リストを開閉する
        $(document).on('click', '.select2-results__group', function () {
            $(this).siblings('ul').slideToggle(200);
        });

        // 2. プルダウンを開いた直後は、ジャンルを閉じた状態（見出しだけ）にしておく
        $('#answer-select').on('select2:open', function () {
            // Select2が画面を作るのを一瞬待つ必要があるため setTimeout を使用
            setTimeout(function () {
                // 文字を検索していない初期状態の時だけ閉じる
                if ($('.select2-search__field').val() === '') {
                    $('.select2-results__group').siblings('ul').hide();
                }
            }, 10);
        });


        window.addEventListener('load', function () {
            setTimeout(function () {
                songDatabase.forEach(function (song) {
                    preloadImage(song.image);
                });
                for (const key in genreResultData) {
                    if (genreResultData[key] && genreResultData[key].images) {
                        preloadImageList(genreResultData[key].images);
                    }
                }
                preloadImage("images/総合評価.png");
            }, 1000);
        });









    </script>
</body>

</html>
